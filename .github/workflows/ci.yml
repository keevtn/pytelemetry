name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy pytelemetry/core pytelemetry/sim
      - name: Golden-vector drift (regenerate from firmware, diff against committed)
        run: uv run python tools/gen_golden.py --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: uv sync --all-extras
      - name: Fast suite
        run: uv run pytest -q -m "not soak"
      - name: Soak
        run: uv run pytest -q -m soak

  build:
    needs: [quality, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: uv sync --all-extras
      - run: uv run pyinstaller --version
      - name: Build executable
        run: uv run python packaging/build.py
      - name: Smoke-test the built binary (--self-test exits 0)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/PyTelemetry/PyTelemetry.exe --self-test
          else
            ./dist/PyTelemetry/PyTelemetry --self-test
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PyTelemetry-${{ matrix.os }}
          path: dist/PyTelemetry-*.zip
          if-no-files-found: error

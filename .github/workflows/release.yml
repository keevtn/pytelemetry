name: Release

# Runs only when YOU push a version tag (e.g. git tag v0.1.0 && git push origin v0.1.0).
# Builds the three executables and attaches them to a GitHub Release. Nothing auto-tags.
on:
  push:
    tags: ["v*"]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: uv sync --all-extras
      - run: uv run python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: PyTelemetry-${{ matrix.os }}
          path: dist/PyTelemetry-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/PyTelemetry-*.zip
          generate_release_notes: true
